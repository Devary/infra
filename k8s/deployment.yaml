apiVersion: apps/v1
kind: Deployment
metadata:
  name: __DEPLOYMENT__
  namespace: __NAMESPACE__
  labels:
    app: __DEPLOYMENT__
    app.kubernetes.io/version: "__PROJECT_VERSION__"
spec:
  replicas: __REPLICAS__
  selector:
    matchLabels:
      app: __DEPLOYMENT__
  template:
    metadata:
      labels:
        app: __DEPLOYMENT__
        app.kubernetes.io/version: "__PROJECT_VERSION__"
    spec:
      serviceAccountName: __SERVICE_ACCOUNT__
      containers:
        - name: __CONTAINER__
          image: __IMAGE__
          imagePullPolicy: Always
          env:
            - name: VAULT_URL
              value: "__VAULT_URL__"
          ports:
            - containerPort: "__PORT__"
            - containerPort: "9000"
